rate_album:
  name: Rate project album
  description: Rate an unrated generated album in a configured project.
  fields:
    project_identifier:
      name: Project
      description: The configured project name or sharer ID. Not needed when an album selector entity is provided.
      required: false
      example: my-project
      selector:
        text:
    rating:
      name: Rating
      description: Personal rating from 1 to 5.
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
    notes:
      name: Review
      description: Optional review text to send with the rating.
      required: false
      selector:
        text:
          multiline: true
    generated_album_id:
      name: Generated album
      description: ID of a specific unrated history entry. Use this or the album selector entity.
      required: false
      example: 619b15da569b793e8a4fd8fd
      selector:
        text:
    select_entity_id:
      name: Album selector entity
      description: Entity ID of the album selector; rates its currently selected album.
      required: false
      example: select.1001_albums_generator_album_om_te_beoordelen
      selector:
        entity:
          domain: select
