rate_album:
  name: Rate project album
  description: Rate an unrated generated album in a configured project.
  fields:
    project_identifier:
      name: Project
      description: The project name or sharer ID configured in this integration.
      required: true
      example: my-project
      selector:
        text:
    rating:
      name: Rating
      description: Personal rating from 1 to 5.
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
    notes:
      name: Review
      description: Optional review text to send with the rating.
      required: false
      selector:
        text:
          multiline: true
    generated_album_id:
      name: Generated album
      description: Optional ID of the selected unrated history entry.
      required: false
      example: 619b15da569b793e8a4fd8fd
      selector:
        text:
